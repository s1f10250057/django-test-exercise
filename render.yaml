databases:
  - name: django-test-db
    plan: free
    databaseName: django_test_sample
    user: django_test_sample

services:
  - type: web
    name: django-test-web-tkns
    env: python
    plan: free
    branch: main
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: django-test-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DJANGO_SETTINGS_MODULE
        value: config.production
      - key: WEB_CONCURRENCY
        value: 4

  - type: cron
    name: django-test-notify-due-tasks
    runtime: python
    plan: starter
    branch: main
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python manage.py notify_due_tasks"
    schedule: "0 * * * *"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: django-test-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DJANGO_SETTINGS_MODULE
        value: config.production
      - key: RENDER_EXTERNAL_HOSTNAME
        value: django-test-web-tkns.onrender.com
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        value: 587
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: EMAIL_USE_TLS
        value: true
      - key: DEFAULT_FROM_EMAIL
        sync: false
