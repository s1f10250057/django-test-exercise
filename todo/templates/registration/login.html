{% load static %}
<!DOCTYPE html>
<html lang="ja">

  <head>
    <title>ログイン | Task Board</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="{% static 'todo/style.css' %}?v=5">
  </head>

  <body>
    <main class="page-shell page-shell-narrow">
      <header class="page-header">
        <div>
          <p class="eyebrow">TASK MANAGEMENT</p>
          <h1>ログイン</h1>
        </div>
      </header>

      <section class="panel">
      {% if form.errors %}
      <p class="login-error">ユーザー名またはパスワードが正しくありません。</p>
      {% endif %}

      <form class="edit-form" method="post">
        {% csrf_token %}
        <div class="field">
          <label for="{{ form.username.id_for_label }}">ユーザー名</label>
          {{ form.username }}
        </div>
        <div class="field">
          <label for="{{ form.password.id_for_label }}">パスワード</label>
          {{ form.password }}
        </div>
        <button type="submit">ログイン</button>
        <input type="hidden" name="next" value="{{ next }}">
      </form>
      </section>
    </main>
  </body>

</html>
