{% extends 'todo/base.html' %}

{% block title %}タスク編集 | Task Board{% endblock %}

{% block content %}
    <main class="page-shell page-shell-narrow">
      <header class="page-header">
        <div>
          <p class="eyebrow">EDIT TASK</p>
          <h1>タスクを編集</h1>
        </div>
      </header>
      <section class="panel">
        <form class="edit-form" action="{% url 'update' task.id %}" method="post">
          {% csrf_token %}
          {% for field in form %}
          <div class="field">
            <label for="{{ field.id_for_label }}">{{ field.label }}</label>
            {{ field }}
            {{ field.errors }}
          </div>
          {% endfor %}
          <div class="form-actions">
            <button type="submit">保存</button>
            <a class="button-secondary" href="{% url 'detail' task.id %}">キャンセル</a>
          </div>
        </form>
      </section>
    </main>
{% endblock %}
